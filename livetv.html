<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LiveStream Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --accent: #a855f7;
            --bg-deep: #09090b;
            --card-bg: #18181b;
        }

        body {
            background-color: var(--bg-deep);
            color: #fafafa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
        }

        .video-container {
            position: sticky;
            top: 0;
            z-index: 50;
            background: #000;
            width: 100%;
            aspect-ratio: 16/9;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .search-sticky {
            position: sticky;
            top: calc(56.25vw);
            z-index: 40;
            background: rgba(9, 9, 11, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .channel-card.active {
            background: linear-gradient(90deg, rgba(168, 85, 247, 0.2) 0%, rgba(168, 85, 247, 0) 100%);
            border-left: 4px solid var(--accent);
        }

        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 24px);
        }

        .loading-shimmer {
            background: linear-gradient(90deg, #18181b 25%, #27272a 50%, #18181b 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- Video Player Section -->
    <section class="video-container">
        <div id="placeholder" class="absolute inset-0 flex flex-col items-center justify-center bg-zinc-950">
            <div class="w-16 h-16 rounded-full bg-purple-500/20 flex items-center justify-center mb-4 animate-pulse">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            </div>
           
        </div>
        <iframe id="main-player" src="" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </section>

    <!-- Controls Section -->
    <section class="search-sticky p-4 space-y-4">
        <div class="relative">
            <input type="text" id="searchInput" 
                   placeholder="Search entertainment & news..." 
                   class="w-full bg-zinc-900 border border-zinc-800 rounded-2xl py-4 px-12 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500/50 transition-all placeholder:text-zinc-600">
            <svg class="absolute left-4 top-4 text-zinc-500" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </div>

        <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
            <button onclick="setFilter('all')" data-filter="all" class="filter-btn shrink-0 px-6 py-2.5 rounded-xl text-xs font-black bg-purple-600 text-white shadow-lg shadow-purple-900/20 transition-all">ALL FEEDS</button>
            <button onclick="setFilter('gb')" data-filter="gb" class="filter-btn shrink-0 px-6 py-2.5 rounded-xl text-xs font-black bg-zinc-800 text-zinc-400 transition-all">UK</button>
            <button onclick="setFilter('us')" data-filter="us" class="filter-btn shrink-0 px-6 py-2.5 rounded-xl text-xs font-black bg-zinc-800 text-zinc-400 transition-all">USA</button>
        </div>
    </section>

    <!-- Channel List -->
    <main id="channelList" class="flex-1 px-4 py-2 space-y-3 mb-24">
        <div class="skeleton space-y-3">
            <div class="h-24 w-full rounded-2xl loading-shimmer opacity-10"></div>
            <div class="h-24 w-full rounded-2xl loading-shimmer opacity-10"></div>
            <div class="h-24 w-full rounded-2xl loading-shimmer opacity-10"></div>
        </div>
    </main>

    <!-- Footer Controller -->
    <footer class="fixed bottom-0 left-0 right-0 bg-zinc-950/95 backdrop-blur-2xl border-t border-zinc-800/50 p-4 pb-safe flex items-center justify-between">
        <div class="flex items-center gap-4 overflow-hidden">
            <div id="footer-img-container" class="w-12 h-12 rounded-xl bg-zinc-900 flex-shrink-0 flex items-center justify-center p-1.5 border border-zinc-800">
                <div class="w-full h-full bg-zinc-800 rounded"></div>
            </div>
            <div class="truncate">
                <p id="current-name" class="text-sm font-black truncate text-white uppercase tracking-tight">Select Channel</p>
                <p id="current-meta" class="text-[10px] text-purple-400 font-bold uppercase tracking-widest">Awaiting Selection</p>
            </div>
        </div>
        <div id="status-dot" class="w-2.5 h-2.5 rounded-full bg-zinc-700"></div>
    </footer>

    <script>
        const API_URL = 'https://api.cdnlivetv.tv/api/v1/channels/?user=cdnlivetv&plan=free';
        const player = document.getElementById('main-player');
        const placeholder = document.getElementById('placeholder');
        const listContainer = document.getElementById('channelList');
        const searchInput = document.getElementById('searchInput');
        const footerName = document.getElementById('current-name');
        const footerMeta = document.getElementById('current-meta');
        const footerImg = document.getElementById('footer-img-container');
        const statusDot = document.getElementById('status-dot');

        let allChannels = [];
        let currentFilter = 'all';
        let activeUrl = '';

        // Comprehensive exclusion list
        const excludedKeywords = [
            // General Sports/Niche requested for removal
            'sport', 'racing', 'football', 'liga', 'espn', 'nba', 'nfl', 'nhl', 'tennis', 
            'sec', 'red bull', 'golf', 'goltv', 'soccer', 'deportes', 'cricket', 
            'acc network', 'dazn', 'btn', 'wwe', 'ufc', 'fight',
            // Baseball / MLB Specific (Teams + Network)
            'mlb', 'baseball', 'yankees', 'red sox', 'dodgers', 'cubs', 'mets', 'braves', 
            'astros', 'phillies', 'blue jays', 'cardinals', 'giants', 'mariners', 
            'rangers', 'diamondbacks', 'guardians', 'twins', 'brewers', 'marlins', 
            'tigers', 'padres', 'pirates', 'reds', 'royals', 'rockies', 'athletics', 'white sox',
            // Specific requested removals
            'altitude', 'nesn', 'tudn', 'universal kids', 'nbc universo', 'universo',
            // Local news/Spanish networks often bundled
            'telemundo', 'univision', 'unimás', 'vix'
        ];

        async function init() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                allChannels = data.channels.filter(ch => {
                    const code = ch.code.toLowerCase();
                    const name = ch.name.toLowerCase();
                    const isRegion = (code === 'us' || code === 'gb');
                    const isExcluded = excludedKeywords.some(k => name.includes(k));
                    return isRegion && !isExcluded;
                });

                render();
            } catch (err) {
                listContainer.innerHTML = `<div class="text-center py-20 text-zinc-500 font-bold">NETWORK ERROR: RELOAD APP</div>`;
            }
        }

        function render() {
            const query = searchInput.value.toLowerCase();
            const filtered = allChannels.filter(ch => {
                const matchesSearch = ch.name.toLowerCase().includes(query);
                const matchesTab = currentFilter === 'all' || ch.code === currentFilter;
                return matchesSearch && matchesTab;
            });

            listContainer.innerHTML = '';
            
            if (filtered.length === 0) {
                listContainer.innerHTML = `<div class="text-center py-20 text-zinc-600 text-xs font-black uppercase tracking-widest">No Feeds Found</div>`;
                return;
            }

            filtered.forEach(ch => {
                const isActive = ch.url === activeUrl;
                const card = document.createElement('div');
                card.className = `channel-card flex items-center p-4 gap-4 rounded-2xl bg-zinc-900/40 border border-zinc-800/40 transition-all ${isActive ? 'active shadow-lg shadow-purple-950/20' : ''}`;
                
                card.innerHTML = `
                    <div class="w-16 h-12 bg-black rounded-xl p-1.5 flex items-center justify-center border border-zinc-800 flex-shrink-0">
                        <img src="${ch.image}" class="max-w-full max-h-full object-contain" loading="lazy" onerror="this.style.display='none'">
                    </div>
                    <div class="flex-1 min-w-0">
                        <h3 class="font-black text-[15px] truncate uppercase tracking-tight ${isActive ? 'text-white' : 'text-zinc-200'}">${ch.name}</h3>
                        <div class="flex items-center gap-2 mt-0.5">
                            <span class="text-[9px] px-1.5 py-0.5 rounded bg-zinc-800 text-zinc-400 font-black">${ch.code.toUpperCase()}</span>
                            <span class="text-[9px] text-green-500 font-bold uppercase tracking-widest">Encrypted Stream</span>
                        </div>
                    </div>
                    <div class="shrink-0">
                        <div class="w-9 h-9 rounded-full flex items-center justify-center ${isActive ? 'bg-purple-600 text-white' : 'bg-zinc-800 text-zinc-500'}">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        </div>
                    </div>
                `;

                card.onclick = () => playChannel(ch);
                listContainer.appendChild(card);
            });
        }

        function playChannel(ch) {
            activeUrl = ch.url;
            placeholder.classList.add('hidden');
            
            // Autoplay and styling updates
            const playUrl = ch.url.includes('?') ? `${ch.url}&autoplay=1` : `${ch.url}?autoplay=1`;
            player.src = playUrl;

            footerName.innerText = ch.name;
            footerMeta.innerText = `${ch.code.toUpperCase()} • LIVE STREAM ACTIVE`;
            footerImg.innerHTML = `<img src="${ch.image}" class="w-full h-full object-contain">`;
            statusDot.className = "w-2.5 h-2.5 rounded-full bg-green-500 shadow-[0_0_12px_rgba(34,197,94,0.6)]";
            
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function setFilter(code) {
            currentFilter = code;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if(btn.dataset.filter === code) {
                    btn.className = "filter-btn shrink-0 px-6 py-2.5 rounded-xl text-xs font-black bg-purple-600 text-white shadow-lg shadow-purple-900/20 transition-all";
                } else {
                    btn.className = "filter-btn shrink-0 px-6 py-2.5 rounded-xl text-xs font-black bg-zinc-800 text-zinc-400 transition-all";
                }
            });
            render();
        }

        searchInput.addEventListener('input', render);
        window.onload = init;
    </script>
</body>
</html>
