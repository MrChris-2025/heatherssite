```html
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>StreamLine TV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --accent: #a855f7;
            --bg-deep: #09090b;
            --card-bg: #18181b;
        }

        body {
            background-color: var(--bg-deep);
            color: #fafafa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Video Header Fixed */
        .video-container {
            position: sticky;
            top: 0;
            z-index: 50;
            background: #000;
            width: 100%;
            aspect-ratio: 16/9;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Glassmorphic Search Bar */
        .search-sticky {
            position: sticky;
            top: calc(56.25vw); /* Height of 16:9 video */
            z-index: 40;
            background: rgba(9, 9, 11, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 10px;
        }

        /* Active State */
        .channel-card.active {
            background: linear-gradient(90deg, rgba(168, 85, 247, 0.15) 0%, rgba(168, 85, 247, 0) 100%);
            border-left: 3px solid var(--accent);
        }

        .channel-card:active {
            transform: scale(0.98);
        }

        /* Safe area for newer iPhones */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }

        .loading-shimmer {
            background: linear-gradient(90deg, #18181b 25%, #27272a 50%, #18181b 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- 1. Video Player Section -->
    <section class="video-container">
        <div id="placeholder" class="absolute inset-0 flex flex-col items-center justify-center bg-zinc-950">
            <div class="w-16 h-16 rounded-full bg-purple-500/10 flex items-center justify-center mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            </div>
            <p class="text-zinc-500 text-xs font-bold uppercase tracking-widest">Select a channel to begin</p>
        </div>
        <iframe id="main-player" 
                src="" 
                allow="autoplay; fullscreen" 
                allowfullscreen>
        </iframe>
    </section>

    <!-- 2. Controls & Search Section -->
    <section class="search-sticky p-4 space-y-3">
        <div class="relative">
            <input type="text" id="searchInput" 
                   placeholder="Search 100+ channels..." 
                   class="w-full bg-zinc-900 border border-zinc-800 rounded-2xl py-3 px-11 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500/50 transition-all">
            <svg class="absolute left-4 top-3.5 text-zinc-500" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </div>

        <div class="flex gap-2 overflow-x-auto pb-1 no-scrollbar">
            <button onclick="setFilter('all')" data-filter="all" class="filter-btn px-5 py-2 rounded-full text-xs font-bold bg-purple-600 text-white transition-all">ALL</button>
            <button onclick="setFilter('gb')" data-filter="gb" class="filter-btn px-5 py-2 rounded-full text-xs font-bold bg-zinc-800 text-zinc-400 transition-all">UK</button>
            <button onclick="setFilter('us')" data-filter="us" class="filter-btn px-5 py-2 rounded-full text-xs font-bold bg-zinc-800 text-zinc-400 transition-all">USA</button>
        </div>
    </section>

    <!-- 3. Channel List Section -->
    <main id="channelList" class="flex-1 px-4 py-2 space-y-2">
        <!-- Skeleton Loading State -->
        <div class="skeleton space-y-2">
            <div class="h-20 w-full rounded-2xl loading-shimmer opacity-20"></div>
            <div class="h-20 w-full rounded-2xl loading-shimmer opacity-20"></div>
            <div class="h-20 w-full rounded-2xl loading-shimmer opacity-20"></div>
            <div class="h-20 w-full rounded-2xl loading-shimmer opacity-20"></div>
        </div>
    </main>

    <!-- 4. Mini Controller / Info -->
    <footer class="fixed bottom-0 left-0 right-0 bg-zinc-900/90 backdrop-blur-xl border-t border-zinc-800 p-4 pb-safe flex items-center justify-between">
        <div class="flex items-center gap-3 overflow-hidden">
            <div id="footer-img-container" class="w-10 h-10 rounded-lg bg-zinc-800 flex-shrink-0 flex items-center justify-center p-1 overflow-hidden border border-zinc-700">
                <div class="w-full h-full bg-zinc-700 animate-pulse rounded"></div>
            </div>
            <div class="truncate">
                <p id="current-name" class="text-sm font-bold truncate">Standby</p>
                <p id="current-meta" class="text-[10px] text-zinc-500 font-bold uppercase tracking-tighter">Ready to stream</p>
            </div>
        </div>
        <div class="flex items-center gap-4 text-purple-500">
             <div class="w-2 h-2 rounded-full bg-green-500 shadow-[0_0_10px_rgba(34,197,94,0.5)]"></div>
        </div>
    </footer>

    <script>
        const API_URL = 'https://api.cdnlivetv.tv/api/v1/channels/?user=cdnlivetv&plan=free';
        const player = document.getElementById('main-player');
        const placeholder = document.getElementById('placeholder');
        const listContainer = document.getElementById('channelList');
        const searchInput = document.getElementById('searchInput');
        const footerName = document.getElementById('current-name');
        const footerMeta = document.getElementById('current-meta');
        const footerImg = document.getElementById('footer-img-container');

        let allChannels = [];
        let currentFilter = 'all';
        let activeUrl = '';

        // Added baseball and mlb to the exclusion list
        const excluded = [
            'sport', 'racing', 'football', 'liga', 'espn', 'nba', 
            'astro', 'nfl', 'nhl', 'tennis', 'sec', 'red bull', 
            'mlb', 'golf', 'goltv', 'soccer', 'deportes', 'cricket', 
            'acc network', 'hubpremier', 'hub premier', 'dazn', 'btn', 
            'cbc news', 'cnbc', 'msg', 'telemundo', 'univision', "unimás", 'wwe',
            'yes network', 'sky sports', 'bt sport', 'baseball'
        ];

        async function init() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                allChannels = data.channels.filter(ch => {
                    const code = ch.code.toLowerCase();
                    const name = ch.name.toLowerCase();
                    const isRegion = (code === 'us' || code === 'gb');
                    const isExcluded = excluded.some(k => name.includes(k));
                    return isRegion && !isExcluded;
                });

                render();
            } catch (err) {
                listContainer.innerHTML = `<div class="text-center py-20 text-zinc-500 font-bold">FAILED TO SYNC FEED</div>`;
            }
        }

        function render() {
            const query = searchInput.value.toLowerCase();
            const filtered = allChannels.filter(ch => {
                const matchesSearch = ch.name.toLowerCase().includes(query);
                const matchesTab = currentFilter === 'all' || ch.code === currentFilter;
                return matchesSearch && matchesTab;
            });

            listContainer.innerHTML = '';
            
            if (filtered.length === 0) {
                listContainer.innerHTML = `<div class="text-center py-20 text-zinc-600 text-sm font-medium">No channels found</div>`;
                return;
            }

            filtered.forEach(ch => {
                const isActive = ch.url === activeUrl;
                const card = document.createElement('div');
                card.className = `channel-card flex items-center p-3 gap-4 rounded-2xl bg-zinc-900/40 border border-zinc-800/50 transition-all ${isActive ? 'active' : ''}`;
                
                card.innerHTML = `
                    <div class="w-16 h-12 bg-black rounded-xl p-1 flex items-center justify-center border border-zinc-800 flex-shrink-0">
                        <img src="${ch.image}" class="max-w-full max-h-full object-contain" loading="lazy" onerror="this.src='https://via.placeholder.com/64x48?text=TV'">
                    </div>
                    <div class="flex-1 min-w-0">
                        <h3 class="font-bold text-sm truncate uppercase tracking-tight">${ch.name}</h3>
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] px-1.5 py-0.5 rounded bg-zinc-800 text-zinc-400 font-black">${ch.code.toUpperCase()}</span>
                            <span class="text-[10px] text-green-500 font-bold uppercase tracking-widest">Live</span>
                        </div>
                    </div>
                    <div class="pr-2">
                        <div class="w-8 h-8 rounded-full flex items-center justify-center ${isActive ? 'bg-purple-600 text-white' : 'bg-zinc-800 text-zinc-500'}">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        </div>
                    </div>
                `;

                card.onclick = () => playChannel(ch);
                listContainer.appendChild(card);
            });
        }

        function playChannel(ch) {
            activeUrl = ch.url;
            placeholder.classList.add('hidden');
            
            // Autoplay implementation
            const playUrl = ch.url.includes('?') ? `${ch.url}&autoplay=1` : `${ch.url}?autoplay=1`;
            player.src = playUrl;

            footerName.innerText = ch.name;
            footerMeta.innerText = `Streaming via ${ch.code === 'gb' ? 'United Kingdom' : 'United States'} Hub`;
            footerImg.innerHTML = `<img src="${ch.image}" class="w-full h-full object-contain">`;
            
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function setFilter(code) {
            currentFilter = code;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if(btn.dataset.filter === code) {
                    btn.className = "filter-btn px-5 py-2 rounded-full text-xs font-bold bg-purple-600 text-white transition-all";
                } else {
                    btn.className = "filter-btn px-5 py-2 rounded-full text-xs font-bold bg-zinc-800 text-zinc-400 transition-all";
                }
            });
            render();
        }

        searchInput.addEventListener('input', render);
        window.onload = init;
    </script>
</body>
</html>
