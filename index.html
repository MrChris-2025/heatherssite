<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HEATHERS MOVIE PAGE</title>

    <link rel="icon" type="image/x-icon" href="https://heather2025.nekoweb.org/images/favicon.ico">
    <link href="https://fonts.cdnfonts.com/css/pecita" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Custom CSS for the visualizer canvas */
        .visualizer-container {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }

        #audio-canvas, #radio-canvas {
            display: block;
            border-radius: 0.5rem;
        }

        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Pecita&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to bottom right, #0d1117, #6b46c1, #d8b4fe);
            color: #e6edf3;
            min-height: 100vh;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Video Modal */
        #videoModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 100;
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        #videoModal.visible {
            opacity: 1;
            visibility: visible;
        }

        #videoModal .modal-content {
            background: #161b22;
            border-radius: 12px;
            max-width: 900px;
            width: 95%;
            padding: 1.5rem;
            position: relative;
            transform: scale(0.95);
            transition: transform 0.3s ease;
            max-height: 85vh;
            overflow-y: auto;
        }

        #videoModal.visible .modal-content {
            transform: scale(1);
        }

        #videoModal .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            font-size: 1.5rem;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        #videoModal .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Video Player & Controls Layout */
        .player-wrapper {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        @media (min-width: 768px) {
            .player-wrapper {
                flex-direction: row;
            }
        }

        .player-main {
            flex: 1;
        }

        .player-sidebar {
            width: 100%;
            max-height: 400px;
            overflow-y: auto;
            border-radius: 8px;
            background-color: #0d1117;
            padding: 1rem;
        }

        @media (min-width: 768px) {
            .player-sidebar {
                width: 300px;
                max-height: none;
            }
        }

        .gallery-container {
            display: grid;
            gap: 1.5rem;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            margin-top: 1.5rem;
        }

        .gallery-card {
            background: #161b22;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .gallery-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .gallery-card img {
            width: 100%;
            height: 225px;
            object-fit: cover;
        }

        .card-info {
            padding: 0.75rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-info h3 {
            font-size: 1rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-info p {
            font-size: 0.8rem;
            color: #8b949e;
        }

        .button-group .active {
            background-color: #2e8b57;
            color: #fff;
        }

        .button-group .inactive {
            background-color: #21262d;
            color: #8b949e;
        }

        .button-group button {
            transition: background-color 0.2s, color 0.2s;
        }

        .continue-watching-card {
            display: flex;
            background: #1f242c;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
            position: relative;
            margin-bottom: 0.75rem;
            padding: 0.5rem;
            width: 250px;
        }

        .continue-watching-card:hover {
            transform: translateX(5px);
        }

        .continue-watching-card .image-container {
            position: relative;
            width: 80px;
            height: 120px;
            flex-shrink: 0;
            border-radius: 4px;
            overflow: hidden;
        }

        .continue-watching-card .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .continue-watching-card .title-area {
            flex-grow: 1;
            padding-left: 1rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .continue-watching-card .title {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 0.25rem;
            color: #c9d1d9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .continue-watching-card .progress {
            font-size: 0.8rem;
            color: #8b949e;
        }

        .continue-watching-card .close-btn-recent {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(0, 0, 0, 0.4);
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
        }

        .nav-button {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-weight: 600;
            transition: background-color 0.2s;
            cursor: pointer;
        }

        .nav-button.active {
            background-color: #d8b4fe;
            color: #000;
        }

        .nav-button.inactive {
            background-color: #21262d;
            color: #8b949e;
        }

        @keyframes pulse-banner {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.08); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        #floatingHeart {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 90;
            cursor: pointer;
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 150px;
            animation: floatAnimation 8s infinite alternate ease-in-out;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.7);
        }

        @keyframes floatAnimation {
            0% { left: 5%; }
            100% { left: 80%; }
        }

        #heartVideoModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 101;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        #heartVideoModal .modal-content-heart {
            background: #1f242c;
            border-radius: 16px;
            padding: 1rem;
            max-width: 95vw;
            width: 400px;
            max-height: 90vh;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        #heartVideoModal .close-btn-heart {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            font-size: 1.2rem;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            transition: background 0.2s;
        }

        @media (max-width: 767px) {
            .container { padding: 1rem; }
            .header { flex-direction: column; align-items: flex-start; gap: 1rem; }
            #searchInput { width: 100%; }
            .nav-button { flex: 1; padding: 0.5rem; font-size: 0.9rem; }
            .gallery-container { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 1rem; }
            .gallery-card img { height: 150px; }
        }

        #iframeContainer:fullscreen { width: 100% !important; height: 100% !important; }

        .favorite-heart {
            position: absolute;
            top: 5px;
            right: 5px;
            z-index: 10;
            font-size: 1.5rem;
            cursor: pointer;
            text-shadow: 0 0 5px black;
        }

        .favorite-heart.active { color: #ff69b4; }
        .favorite-heart.inactive { color: #a0a0a0; }

        .watched-banner {
            position: absolute;
            top: 0;
            right: 0;
            background: #2e8b57;
            color: white;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 4px 8px;
            border-bottom-left-radius: 8px;
            z-index: 5;
            box-shadow: -2px 2px 5px rgba(0,0,0,0.3);
            pointer-events: none;
        }

        /* Live TV Fixes */
        .channel-card { cursor: pointer; flex-shrink: 0; }
        .channel-card.active { background-color: #4c1d95; border-color: #a78bfa; }
        #channelList { overflow-y: scroll !important; -webkit-overflow-scrolling: touch; }
        #channelList::-webkit-scrollbar { width: 6px; }
        #channelList::-webkit-scrollbar-thumb { background: #374151; border-radius: 10px; }
    </style>
</head>

<body class="bg-gradient-to-br from-black via-purple-500 to-purple-200 text-gray-100">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                        pecita: ['Pecita', 'cursive'],
                    },
                    colors: {
                        'primary-purple': '#a78bfa',
                        'dark-purple': '#4c1d95',
                        'light-purple': '#c4b5fd',
                        'background-dark': '#111827',
                        'background-light': '#374151',
                    },
                },
            },
        }
    </script>

    <audio id="myAudio" src="hollaBB.m4a" preload="auto" crossorigin="anonymous"></audio>
    <audio id="radioAudio" crossorigin="anonymous" preload="none"></audio>

    <div class="container py-8">
        <header class="flex flex-col md:flex-row items-center justify-between gap-4 mb-8">
            <h1 class="text-4xl font-bold text-purple-300 font-pecita">heathers site</h1>
            
            <button id="liveTvTrigger" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
                <span class="text-2xl" role="img" aria-label="Union Jack Flag">🇬🇧</span>
                <span class="text-white"><b>Live</b></span>
            </button>

            <div class="flex flex-col md:flex-row items-center gap-4 w-full md:w-auto">
                <div class="relative w-full md:w-auto">
                    <input type="text" id="searchInput" placeholder="Search for movies or TV shows..."
                        class="w-full md:w-80 p-3 pl-10 bg-gray-800 rounded-full text-white focus:outline-none focus:ring-2 focus:ring-purple-300 transition-all duration-300" />
                    <svg class="absolute left-3 top-1/2 -translate-y-1/2 h-5 w-5 text-gray-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd"></path></svg>
                </div>
                <div class="flex gap-2 w-full md:w-auto">
                    <button id="showMoviesBtn" class="nav-button active">Movies</button>
                    <button id="showTvBtn" class="nav-button inactive">TV Shows</button>
                </div>
            </div>
        </header>

        <div class="flex flex-row items-start justify-center md:justify-start gap-4 mb-8">
            <div class="w-full max-w-48 p-3 bg-transparent rounded-xl shadow-2xl transition-all duration-300">
                <h1 class="text-base font-bold text-white mb-2 text-center">Can I Get A Holla?!</h1>
                <div class="visualizer-container mb-3 h-16 p-0.5 bg-gray-700 rounded-lg shadow-inner">
                    <canvas id="audio-canvas" class="w-full h-full"></canvas>
                </div>
                <div class="flex justify-center space-x-2">
                    <button id="playButton" onclick="togglePlayback()" class="flex items-center justify-center w-32 py-2 text-white bg-purple-400 rounded-lg shadow-md hover:bg-purple-700 focus:outline-none transition-all duration-200">
                        <svg id="playIcon" class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                        <svg id="pauseIcon" class="w-4 h-4 hidden" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 9a1 1 0 000 2h6a1 1 0 100-2H7z" clip-rule="evenodd"></path></svg>
                    </button>
                </div>
                <p id="message" class="mt-4 text-sm text-center text-gray-500 h-5">Click to begin</p>
            </div>

            <div class="w-full max-w-48 p-3 bg-transparent rounded-xl shadow-2xl transition-all duration-300">
                <select id="radioStationSelect" class="w-full mb-2 bg-gray-800 text-white text-xs p-1 rounded">
                    <option value="https://streams.80s80s.de/party/mp3-192/">80s Party</option>
                    <option value="https://80s-90s.stream.laut.fm/80s-90s">80s-90s Laut.fm</option>
                </select>
                <div class="visualizer-container mb-3 h-16 p-0.5 bg-gray-700 rounded-lg shadow-inner">
                    <canvas id="radio-canvas" class="w-full h-full"></canvas>
                </div>
                <div class="flex justify-center space-x-2">
                    <button id="radioPlayButton" onclick="toggleRadioPlayback()" class="flex items-center justify-center w-32 py-2 text-white bg-blue-500 rounded-lg shadow-md hover:bg-blue-700 transition-all duration-200">
                        <svg id="radioPlayIcon" class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                        <svg id="radioPauseIcon" class="w-4 h-4 hidden" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 9a1 1 0 000 2h6a1 1 0 100-2H7z" clip-rule="evenodd"></path></svg>
                    </button>
                </div>
                <p id="radioMessage" class="mt-4 text-sm text-center text-gray-500 h-5">Radio</p>
            </div>
        </div>

        <section id="continueWatchingSection" class="mt-8 mb-8 hidden">
            <h2 class="text-2xl font-semibold mb-4">Continue Watching</h2>
            <div id="continueWatchingContainer" class="flex overflow-x-auto gap-4 pb-4 no-scrollbar"></div>
        </section>

        <main class="mt-8">
            <div class="flex items-center justify-between mb-6">
                <h2 id="galleryTitle" class="text-2xl font-semibold">Popular Movies</h2>
                <div class="flex items-center gap-2">
                    <button id="prevPage" class="p-2 bg-gray-700 rounded-full text-white hover:bg-gray-600 disabled:opacity-50"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" /></svg></button>
                    <span id="pageInfo" class="text-gray-100 text-sm"></span>
                    <button id="nextPage" class="p-2 bg-gray-700 rounded-full text-white hover:bg-gray-600 disabled:opacity-50"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" /></svg></button>
                </div>
            </div>
            <div id="galleryContainer" class="gallery-container"></div>
            <div class="flex items-center justify-end mt-6">
                <div class="flex items-center gap-2">
                    <button id="prevPageBottom" class="p-2 bg-gray-700 rounded-full text-white hover:bg-gray-600 disabled:opacity-50"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" /></svg></button>
                    <span id="pageInfoBottom" class="text-gray-100 text-sm"></span>
                    <button id="nextPageBottom" class="p-2 bg-gray-700 rounded-full text-white hover:bg-gray-600 disabled:opacity-50"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" /></svg></button>
                </div>
            </div>
        </main>
    </div>

    <div id="videoModal" class="hidden">
        <div class="modal-content">
            <button id="modalCloseBtn" class="close-btn">&times;</button>
            <h2 id="modalTitle" class="text-xl md:text-2xl font-bold mb-4"></h2>
            <div class="player-wrapper">
                <div class="player-main">
                    <div id="iframeContainer" class="relative w-full h-0 pb-[56.25%] rounded-lg overflow-hidden bg-black"></div>

                <div class="player-sidebar">

    <div id="liveTvModal" class="fixed inset-0 z-[110] hidden flex items-center justify-center bg-black/80 backdrop-blur-sm">
        <div class="relative w-full max-w-6xl mx-4 bg-gray-900 rounded-2xl border border-purple-500/30 overflow-hidden shadow-2xl">
            <div class="flex items-center justify-between p-4 bg-gray-800/50">
                <div class="flex items-center gap-4">
                    <h3 class="text-xl font-bold text-purple-300">Live TV 🇬🇧</h3>
                    <input type="text" id="liveSearchInput" placeholder="Search channels..." class="bg-gray-700 text-white text-xs px-3 py-1.5 rounded-full outline-none focus:ring-1 focus:ring-purple-400 w-48">
                </div>
                <button id="closeLiveTv" class="h-8 w-8 rounded-full bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white transition-all flex items-center justify-center">✕</button>
            </div>
            
            <div class="flex flex-col md:flex-row h-[70vh]">
                <div class="flex-1 bg-black relative">
                    <div id="livePlaceholder" class="absolute inset-0 flex items-center justify-center text-gray-500">
                        <p>Select a channel to start watching</p>
                    </div>
                    <iframe id="main-player" class="w-full h-full" src="" frameborder="0" allowfullscreen></iframe>
                </div>
                
                <div class="w-full md:w-80 bg-gray-900 border-l border-gray-800 flex flex-col overflow-hidden">
                    <div class="p-2 border-b border-gray-800 flex gap-1 overflow-x-auto no-scrollbar shrink-0">
                        <button onclick="setFilter('all')" data-filter="all" class="filter-btn shrink-0 px-4 py-1.5 rounded-lg text-[10px] font-black bg-purple-600 text-white">ALL</button>
                        <button onclick="setFilter('us')" data-filter="us" class="filter-btn shrink-0 px-4 py-1.5 rounded-lg text-[10px] font-black bg-zinc-800 text-zinc-400">USA</button>
                        <button onclick="setFilter('gb')" data-filter="gb" class="filter-btn shrink-0 px-4 py-1.5 rounded-lg text-[10px] font-black bg-zinc-800 text-zinc-400">UK</button>
                    </div>
                    <div id="channelList" class="flex-1 overflow-y-auto p-2 space-y-2">
                    </div>
                    <div class="p-3 bg-black/40 border-t border-gray-800 flex items-center gap-3 shrink-0">
                        <div id="footer-img-container" class="w-8 h-8 rounded bg-zinc-800 flex-shrink-0"></div>
                        <div class="min-w-0">
                            <p id="current-name" class="text-[10px] font-bold truncate text-white uppercase">Waiting...</p>
                            <p id="current-meta" class="text-[8px] text-zinc-500 truncate">Select Feed</p>
                        </div>
                        <div id="status-dot" class="ml-auto w-2 h-2 rounded-full bg-zinc-700"></div>
                    </div>
                </div>
            </div>

        // --- FAVORITES LOGIC ---
        async function loadFavorites() {
            try {
                const Favorites = Parse.Object.extend('Favorites');
                const query = new Parse.Query(Favorites);
                query.limit(1000);
                const results = await query.find();
                favoritedItems = results.reduce((map, item) => {
                    const key = `${item.get('tmdbId')}-${item.get('type')}`;
                    map[key] = item;
                    return map;
                }, {});
            } catch (err) { console.error("Favorites load fail:", err); }
        }

        async function toggleFavorite(tmdbId, type, posterUrl, title) {
            const key = `${tmdbId}-${type}`;
            const isFavorited = favoritedItems.hasOwnProperty(key);
            const Favorites = Parse.Object.extend('Favorites');
            if (isFavorited) {
                try { await favoritedItems[key].destroy(); delete favoritedItems[key]; } catch (err) { console.error(err); }
            } else {
                try {
                    const favorite = new Favorites();
                    favorite.set('tmdbId', tmdbId);
                    favorite.set('type', type);
                    favorite.set('posterUrl', posterUrl);
                    favorite.set('title', title);
                    favoritedItems[key] = await favorite.save();
                } catch (err) { console.error(err); }
            }
            updateUI();
            if (favoritesModal.classList.contains('flex')) renderFavoritesModal();
        }

        async function renderFavoritesModal() {
            favoritesGrid.innerHTML = '';
            const favoriteArray = Object.values(favoritedItems);
            if (favoriteArray.length === 0) { noFavoritesMessage.classList.remove('hidden'); return; }
            noFavoritesMessage.classList.add('hidden');
            favoriteArray.forEach(item => {
                const card = document.createElement('div');
                card.className = "gallery-card";
                card.innerHTML = `
                    <span class="favorite-heart active" data-id="${item.get('tmdbId')}" data-type="${item.get('type')}" data-title="${item.get('title')}" data-poster="${item.get('posterUrl')}">❤</span>
                    <img src="${item.get('posterUrl')}" alt="${item.get('title')}">
                    <div class="card-info"><h3>${item.get('title')}</h3><p>${item.get('type')}</p></div>`;
                card.querySelector('.favorite-heart').addEventListener('click', e => {
                    e.stopPropagation();
                    toggleFavorite(parseInt(e.target.dataset.id), e.target.dataset.type, e.target.dataset.poster, e.target.dataset.title);
                });
                card.addEventListener('click', async () => {
                    const details = await fetchContentDetails(item.get('tmdbId'), item.get('type'));
                    if (details) { closeFavoritesModal(); openPlayer(details); }
                });
                favoritesGrid.appendChild(card);
            });
        }

        function openFavoritesModal() { favoritesModal.classList.remove('hidden'); favoritesModal.classList.add('flex'); renderFavoritesModal(); }
        function closeFavoritesModal() { favoritesModal.classList.add('hidden'); favoritesModal.classList.remove('flex'); }

        // --- RECENTLY WATCHED ---
        async function loadRecentlyWatched() {
            try {
                const Recent = Parse.Object.extend('RecentlyWatched');
                const query = new Parse.Query(Recent);
                query.descending('updatedAt');
                const results = await query.find();
                recentlyWatchedItems = {};
                results.forEach(item => {
                    recentlyWatchedItems[`${item.get('tmdbId')}-${item.get('type')}`] = { 
                        tmdbId: item.get('tmdbId'),
                        type: item.get('type'),
                        season: item.get('season'), 
                        episode: item.get('episode'), 
                        date: item.updatedAt,
                        parseObj: item
                    };
                });
                renderRecentlyWatched();
            } catch (err) { console.error(err); }
        }

        async function renderRecentlyWatched() {
            const recentArray = Object.values(recentlyWatchedItems).sort((a, b) => b.date - a.date);
            if (recentArray.length === 0) {
                continueWatchingSection.classList.add('hidden');
                return;
            }
            
            continueWatchingSection.classList.remove('hidden');
            continueWatchingContainer.innerHTML = '';
            
            for (const item of recentArray) {
                const details = await fetchContentDetails(item.tmdbId, item.type);
                if (!details) continue;
                
                const card = document.createElement('div');
                card.className = "continue-watching-card";
                card.innerHTML = `
                    <button class="close-btn-recent">&times;</button>
                    <div class="image-container">
                        <img src="${IMAGE_BASE_URL}${details.poster_path}" alt="${details.title || details.name}">
                    </div>
                    <div class="title-area">
                        <div class="title">${details.title || details.name}</div>
                        <div class="progress">${item.type === 'tv' ? `S${item.season} E${item.episode}` : 'Movie'}</div>
                    </div>
                `;
                
                card.querySelector('.close-btn-recent').onclick = async (e) => {
                    e.stopPropagation();
                    await item.parseObj.destroy();
                    delete recentlyWatchedItems[`${item.tmdbId}-${item.type}`];
                    renderRecentlyWatched();
                };
                
                card.onclick = () => openPlayer(details, item.season, item.episode);
                continueWatchingContainer.appendChild(card);
            }
        }

        async function saveRecentlyWatched() {
            if (!currentItemData) return;
            try {
                const Recent = Parse.Object.extend('RecentlyWatched');
                const query = new Parse.Query(Recent);
                query.equalTo('tmdbId', currentItemData.id);
                query.equalTo('type', currentType);
                let record = await query.first() || new Recent();
                record.set('tmdbId', currentItemData.id);
                record.set('type', currentType);
                if (currentType === 'tv') { 
                    record.set('season', parseInt(seasonSelect.value)); 
                    record.set('episode', parseInt(episodeSelect.value)); 
                }
                await record.save();
                loadRecentlyWatched(); // Refresh
            } catch (err) { console.error(err); }
        }

        // --- TMDB FETCHING ---
        async function fetchContent(type, page, query = '') {
            try {
                const url = query ? `${BASE_URL}/search/${type}?api_key=${API_KEY}&query=${encodeURIComponent(query)}&page=${page}` : `${BASE_URL}/${type}/popular?api_key=${API_KEY}&page=${page}`;
                const res = await fetch(url);
                return await res.json();
            } catch (err) { return null; }
        }

        async function fetchContentDetails(id, type) {
            try {
                const res = await fetch(`${BASE_URL}/${type}/${id}?api_key=${API_KEY}`);
                const data = await res.json();
                if (type === 'tv' && data.seasons) {
                    const seasonPromises = data.seasons.filter(s => s.season_number >= 1).map(async s => {
                        const sRes = await fetch(`${BASE_URL}/tv/${id}/season/${s.season_number}?api_key=${API_KEY}`);
                        const sData = await sRes.json();
                        return { ...s, episodes: sData.episodes || [] };
                    });
                    data.seasons = await Promise.all(seasonPromises);
                }
                return data;
            } catch (err) { return null; }
        }

        async function fetchTrailer(id, type) {
            try {
                const res = await fetch(`${BASE_URL}/${type}/${id}/videos?api_key=${API_KEY}`);
                const data = await res.json();
                const trailer = data.results.find(v => v.site === 'YouTube' && (v.type === 'Trailer' || v.type === 'Teaser'));
                return trailer ? `https://www.youtube.com/embed/${trailer.key}` : null;
            } catch (err) { return null; }
        }

        // --- RENDERING ---
        function renderGallery(items) {
            galleryContainer.innerHTML = '';
            if (!items?.length) { galleryContainer.innerHTML = '<p class="col-span-full text-center">No results.</p>'; return; }
            items.forEach(item => {
                const title = item.title || item.name;
                const posterUrl = `${IMAGE_BASE_URL}${item.poster_path}`;
                const isFavorited = favoritedItems.hasOwnProperty(`${item.id}-${currentType}`);
                const card = document.createElement('div');
                card.className = "gallery-card";
                
                let watchedBanner = '';
                const recent = recentlyWatchedItems[`${item.id}-${currentType}`];
                if (recent) watchedBanner = `<div class="watched-banner">Watched ${new Date(recent.date).toLocaleDateString()}</div>`;

                card.innerHTML = `
                    ${watchedBanner}
                    <span class="favorite-heart ${isFavorited ? 'active' : 'inactive'}"> ${isFavorited ? '❤' : '♡'}</span>
                    <img src="${posterUrl}" alt="${title}">
                    <div class="card-info"><h3>${title}</h3><p>${(item.release_date || item.first_air_date || '').substring(0, 4)}</p></div>`;
                
                card.querySelector('.favorite-heart').onclick = e => { e.stopPropagation(); toggleFavorite(item.id, currentType, posterUrl, title); };
                card.onclick = async () => { const details = await fetchContentDetails(item.id, currentType); if (details) openPlayer(details); };
                galleryContainer.appendChild(card);
            });
        }

        function updateUI() {
            fetchContent(currentType, currentPage, currentQuery).then(data => {
                if (!data) return;
                renderGallery(data.results);
                pageInfoSpan.textContent = pageInfoBottomSpan.textContent = `Page ${data.page} of ${data.total_pages}`;
                prevPageBtn.disabled = prevPageBottomBtn.disabled = data.page <= 1;
                nextPageBtn.disabled = nextPageBottomBtn.disabled = data.page >= data.total_pages;
                galleryTitle.textContent = currentQuery ? `Results for "${currentQuery}"` : `Popular ${currentType === 'movie' ? 'Movies' : 'TV Shows'}`;
            });
        }

        // --- PLAYER LOGIC ---
        function openPlayer(itemData, s = null, e = null) {
            currentItemData = itemData;
            const isMovie = !!itemData.title;
            const type = isMovie ? 'movie' : 'tv';
            currentType = type;
            
            modalTitle.textContent = itemData.title || itemData.name;
            
            const isTV = type === 'tv';
            episodeSelector.classList.toggle('hidden', !isTV);
            episodeNavButtons.classList.toggle('hidden', !isTV);
            
            videoModal.classList.remove('hidden');
            videoModal.classList.add('visible');
            
            if (isTV) {
                populateSeasonSelect(s, e);
            } else {
                summaryDisplay.textContent = itemData.overview;
                populateSourceSelector();
            }
        }

        function populateSourceSelector() {
            const list = isSandboxMode ? sandboxedSources : noSandboxSources;
            sourceSelector.innerHTML = availableSources.filter(s => list.includes(s.id)).map(s => `<option value="${s.id}">${s.name}</option>`).join('');
            sourceSelector.onchange = updatePlayer;
            updatePlayer();
        }

        function populateSeasonSelect(s, e) {
            if (!currentItemData.seasons) return;
            seasonSelect.innerHTML = currentItemData.seasons.map(s => `<option value="${s.season_number}">Season ${s.season_number}</option>`).join('');
            if (s) seasonSelect.value = s;
            seasonSelect.onchange = () => populateEpisodeSelect();
            populateEpisodeSelect(e);
        }

        function populateEpisodeSelect(e) {
            const season = currentItemData.seasons.find(s => s.season_number == seasonSelect.value);
            if (!season || !season.episodes) return;
            episodeSelect.innerHTML = season.episodes.map(ep => `<option value="${ep.episode_number}">Ep ${ep.episode_number}: ${ep.name}</option>`).join('');
            if (e) episodeSelect.value = e;
            episodeSelect.onchange = updatePlayer;
            populateSourceSelector();
        }

        function updatePlayer() {
            if (!currentItemData) return;
            const src = availableSources.find(s => s.id === sourceSelector.value);
            if (!src) return;

            let url = "";
            if (currentType === 'movie') {
                url = src.urls.movie.replace('{id}', currentItemData.id);
            } else {
                const sNum = seasonSelect.value;
                const eNum = episodeSelect.value;
                url = src.urls.tv.replace('{id}', currentItemData.id)
                              .replace('{season}', sNum)
                              .replace('{episode}', eNum);
                
                // Show Episode Summary
                const season = currentItemData.seasons.find(s => s.season_number == sNum);
                const ep = season?.episodes.find(ep => ep.episode_number == eNum);
                summaryDisplay.textContent = ep?.overview || "No episode summary available.";
                nowPlayingDisplay.textContent = ep ? `Playing: ${ep.name}` : "";
            }
            
            iframeContainer.innerHTML = `<iframe id="videoPlayer" class="w-full h-full absolute" src="${url}" allowfullscreen ${isSandboxMode ? 'sandbox="allow-same-origin allow-scripts allow-forms allow-pointer-lock allow-fullscreen"' : ''}></iframe>`;
            saveRecentlyWatched();
        }

        // --- NAVIGATION BUTTONS ---
        prevEpisodeBtn.onclick = () => {
            if (episodeSelect.selectedIndex > 0) {
                episodeSelect.selectedIndex--;
                updatePlayer();
            } else if (seasonSelect.selectedIndex > 0) {
                seasonSelect.selectedIndex--;
                populateEpisodeSelect();
                episodeSelect.selectedIndex = episodeSelect.options.length - 1;
                updatePlayer();
            }
        };

        nextEpisodeBtn.onclick = () => {
            if (episodeSelect.selectedIndex < episodeSelect.options.length - 1) {
                episodeSelect.selectedIndex++;
                updatePlayer();
            } else if (seasonSelect.selectedIndex < seasonSelect.options.length - 1) {
                seasonSelect.selectedIndex++;
                populateEpisodeSelect();
                episodeSelect.selectedIndex = 0;
                updatePlayer();
            }
        };

        // --- LIVE TV LOGIC ---
        const LIVE_API_URL = 'https://api.cdnlivetv.tv/api/v1/channels/?user=cdnlivetv&plan=free';
        let allChannels = [];
        let currentFilter = 'all';
        let activeLiveUrl = '';

        const excludedKeywords = [
            'sport', 'racing', 'football', 'liga', 'espn', 'nba', 'nfl', 'nhl', 'tennis', 
            'sec', 'red bull', 'golf', 'goltv', 'soccer', 'deportes', 'cricket', 
            'acc network', 'dazn', 'btn', 'wwe', 'ufc', 'fight',
            'mlb', 'baseball', 'yankees', 'red sox', 'dodgers', 'cubs', 'mets', 'braves', 
            'astros', 'phillies', 'blue jays', 'cardinals', 'giants', 'mariners', 
            'rangers', 'diamondbacks', 'guardians', 'twins', 'brewers', 'marlins', 
            'tigers', 'padres', 'orioles', 'angels', 'pirates', 'nationals', 'rays', 'reds', 'royals', 'rockies', 'athletics', 'white sox',
            'altitude', 'nesn', 'tudn', 'universal kids', 'nbc universo', 'universo',
            'telemundo', 'astro', 'yes', 'hub', 'univision', 'unimás', 'vix'
        ];

        async function initLiveTv() {
            try {
                const response = await fetch(LIVE_API_URL);
                const data = await response.json();
                allChannels = data.channels.filter(ch => {
                    const code = ch.code.toLowerCase();
                    const name = ch.name.toLowerCase();
                    const isRegion = (code === 'us' || code === 'gb');
                    const isExcluded = excludedKeywords.some(k => name.includes(k));
                    return isRegion && !isExcluded;
                });
                renderLiveChannels();
            } catch (err) {
                channelList.innerHTML = `<p class="text-xs text-red-500 text-center py-10">Error loading channels</p>`;
            }
        }

        function renderLiveChannels() {
            const query = liveSearchInput.value.toLowerCase();
            const filtered = allChannels.filter(ch => {
                const matchesSearch = ch.name.toLowerCase().includes(query);
                const matchesTab = currentFilter === 'all' || ch.code === currentFilter;
                return matchesSearch && matchesTab;
            });

            channelList.innerHTML = '';
            filtered.forEach(ch => {
                const isActive = ch.url === activeLiveUrl;
                const card = document.createElement('div');
                card.className = `channel-card flex items-center p-3 gap-3 rounded-xl border border-gray-800 transition-all ${isActive ? 'active' : 'bg-gray-800/40 hover:bg-gray-800'}`;
                card.innerHTML = `
                    <div class="w-10 h-10 bg-black rounded p-1 flex items-center justify-center shrink-0 border border-gray-700">
                        <img src="${ch.image}" class="max-w-full max-h-full object-contain" onerror="this.style.display='none'">
                    </div>
                    <div class="flex-1 min-w-0">
                        <h4 class="text-[11px] font-bold truncate text-white uppercase">${ch.name}</h4>
                        <span class="text-[8px] text-gray-500 font-bold">${ch.code.toUpperCase()}</span>
                    </div>
                `;
                card.onclick = () => playLiveChannel(ch);
                channelList.appendChild(card);
            });
        }

        function playLiveChannel(ch) {
            activeLiveUrl = ch.url;
            livePlaceholder.classList.add('hidden');
            livePlayer.src = ch.url.includes('?') ? `${ch.url}&autoplay=1` : `${ch.url}?autoplay=1`;
            
            footerName.innerText = ch.name;
            footerMeta.innerText = `${ch.code.toUpperCase()} • LIVE STREAM ACTIVE`;
            footerImg.innerHTML = `<img src="${ch.image}" class="w-full h-full object-contain">`;
            statusDot.className = "ml-auto w-2 h-2 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.6)]";
            renderLiveChannels();
        }

        window.setFilter = (code) => {
            currentFilter = code;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if(btn.dataset.filter === code) {
                    btn.classList.replace('bg-zinc-800', 'bg-purple-600');
                    btn.classList.replace('text-zinc-400', 'text-white');
                } else {
                    btn.classList.replace('bg-purple-600', 'bg-zinc-800');
                    btn.classList.replace('text-white', 'text-zinc-400');
                }
            });
            renderLiveChannels();
        };

        liveTvTrigger.addEventListener('click', () => {
            liveTvModal.classList.remove('hidden');
            if (allChannels.length === 0) initLiveTv();
        });
        closeLiveTv.addEventListener('click', () => {
            liveTvModal.classList.add('hidden');
            livePlayer.src = "";
        });
        liveSearchInput.addEventListener('input', renderLiveChannels);

        // --- AUDIO VISUALIZERS ---
        const audio = document.getElementById('myAudio');
        const radioAudio = document.getElementById('radioAudio');
        let aCtx, rCtx, aAn, rAn;

        function initAudio(type) {
            if (type === 'holla' && !aCtx) {
                aCtx = new (window.AudioContext || window.webkitAudioContext)();
                aAn = aCtx.createAnalyser();
                aCtx.createMediaElementSource(audio).connect(aAn);
                aAn.connect(aCtx.destination);
            } else if (type === 'radio' && !rCtx) {
                rCtx = new (window.AudioContext || window.webkitAudioContext)();
                rAn = rCtx.createAnalyser();
                rCtx.createMediaElementSource(radioAudio).connect(rAn);
                rAn.connect(rCtx.destination);
            }
        }

        window.togglePlayback = () => {
            initAudio('holla');
            if (audio.paused) { radioAudio.pause(); audio.play(); } else audio.pause();
        };

        window.toggleRadioPlayback = () => {
            initAudio('radio');
            if (radioAudio.paused) {
                audio.pause();
                radioAudio.src = document.getElementById('radioStationSelect').value;
                radioAudio.play();
            } else radioAudio.pause();
        };

        // --- FLOATING HEART ---
        floatingHeart.onclick = () => { heartVideoModal.style.display = 'flex'; };
        heartModalCloseBtn.onclick = () => { heartVideoModal.style.display = 'none'; document.getElementById('heatherSecretYouTube').src = document.getElementById('heatherSecretYouTube').src; };

        // --- EVENT LISTENERS ---
        searchInput.oninput = () => { currentQuery = searchInput.value; currentPage = 1; updateUI(); };
        showMoviesBtn.onclick = () => { currentType = 'movie'; currentPage = 1; showMoviesBtn.classList.replace('inactive', 'active'); showTvBtn.classList.replace('active', 'inactive'); updateUI(); };
        showTvBtn.onclick = () => { currentType = 'tv'; currentPage = 1; showTvBtn.classList.replace('inactive', 'active'); showMoviesBtn.classList.replace('active', 'inactive'); updateUI(); };
        
        const paginate = (dir) => { currentPage += dir; updateUI(); window.scrollTo(0, 0); };
        prevPageBtn.onclick = prevPageBottomBtn.onclick = () => paginate(-1);
        nextPageBtn.onclick = nextPageBottomBtn.onclick = () => paginate(1);
        
        modalCloseBtn.onclick = () => { videoModal.classList.remove('visible'); setTimeout(() => { videoModal.classList.add('hidden'); iframeContainer.innerHTML = ''; }, 300); };
        fullscreenBtn.onclick = () => iframeContainer.requestFullscreen();
        openFavoritesBtn.onclick = openFavoritesModal;
        closeFavoritesBtn.onclick = closeFavoritesModal;

        showNoSandboxBtn.onclick = () => { isSandboxMode = false; showNoSandboxBtn.classList.add('active', 'ring-2'); showSandboxBtn.classList.remove('active', 'ring-2'); populateSourceSelector(); };
        showSandboxBtn.onclick = () => { isSandboxMode = true; showSandboxBtn.classList.add('active', 'ring-2'); showNoSandboxBtn.classList.remove('active', 'ring-2'); populateSourceSelector(); };

        trailerBtn.onclick = async () => {
            const trailerUrl = await fetchTrailer(currentItemData.id, currentType);
            if (trailerUrl) iframeContainer.innerHTML = `<iframe class="w-full h-full absolute" src="${trailerUrl}" allowfullscreen></iframe>`;
        };

        document.addEventListener('DOMContentLoaded', () => {
            loadFavorites();
            loadRecentlyWatched();
            updateUI();
        });
    </script>
</body>

</html>
