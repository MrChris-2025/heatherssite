<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>heathers site</title>
    
    <link rel="apple-touch-icon" sizes="180x180" href="ellie.png.png">
    <link rel="icon" type="image/png" sizes="192x192" href="ellie.png.png">
    
    <link href="https://fonts.cdnfonts.com/css/pecita" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://unpkg.com/parse@4.0.0/dist/parse.min.js"></script>

    <script type="module" src="heatherscript.js" defer></script>

    <style>
        :root {
            --p900: #4c1d95;
            --p600: #9333ea;
            --glass-bg: rgba(15, 10, 30, 0.4);
            --glass-border: rgba(147, 51, 234, 0.25);
            --accent-glow: rgba(147, 51, 234, 0.5);
        }

        /* Custom CSS for the visualizer canvas */
        .visualizer-container {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }

        #audio-canvas, #radio-canvas {
            display: block;
            border-radius: 0.5rem;
        }

        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Pecita&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to bottom right, #0d1117, #6b46c1, #d8b4fe);
            color: #e6edf3;
            min-height: 100vh;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Video Modal Styles - Restored and Stabilized */
        #videoModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 100;
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            overflow: hidden;
        }

        #videoModal.visible {
            opacity: 1;
            visibility: visible;
        }

        #videoModal .modal-content {
            background: #161b22;
            border-radius: 12px;
            max-width: 900px;
            width: 95%;
            padding: 1.5rem;
            position: relative;
            transform: scale(0.95);
            transition: transform 0.3s ease;
            max-height: 85vh;
            overflow-y: auto;
        }

        #videoModal.visible .modal-content {
            transform: scale(1);
        }

        #videoModal .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            font-size: 1.5rem;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        #videoModal .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Video Player & Controls Layout */
        .player-wrapper {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        @media (min-width: 768px) {
            .player-wrapper {
                flex-direction: row;
            }
        }

        .player-main {
            flex: 1;
        }

        .player-sidebar {
            width: 100%;
            max-height: 400px;
            overflow-y: auto;
            border-radius: 8px;
            background-color: #0d1117;
            padding: 1rem;
        }

        @media (min-width: 768px) {
            .player-sidebar {
                width: 300px;
                max-height: none;
            }
        }

        .gallery-container {
            display: grid;
            gap: 1.5rem;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            margin-top: 1.5rem;
        }

        .gallery-card {
            background: #161b22;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .gallery-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .gallery-card img {
            width: 100%;
            height: 225px;
            object-fit: cover;
        }

        .card-info {
            padding: 0.75rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-info h3 {
            font-size: 1rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-info p {
            font-size: 0.8rem;
            color: #8b949e;
        }

        .button-group .active {
            background-color: #2e8b57;
            color: #fff;
        }

        .button-group .inactive {
            background-color: #21262d;
            color: #8b949e;
        }

        .button-group button {
            transition: background-color 0.2s, color 0.2s;
        }

        /* COMPACTED & SMALLER CONTINUE WATCHING CARDS */
        .continue-watching-card {
            display: flex;
            align-items: center;
            background: #1f242c;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
            position: relative;
            margin-bottom: 0.5rem;
            padding: 0.35rem;
        }

        .continue-watching-card:hover {
            transform: translateX(5px);
        }

        .continue-watching-card .image-container {
            position: relative;
            width: 45px;
            height: 65px;
            flex-shrink: 0;
            border-radius: 4px;
            overflow: hidden;
        }

        .continue-watching-card .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .continue-watching-card .title-area {
            flex-grow: 1;
            padding-left: 0.75rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0; /* important for text truncate */
        }

        .continue-watching-card .title {
            font-weight: 600;
            font-size: 0.8rem;
            margin-bottom: 0.1rem;
            color: #c9d1d9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .continue-watching-card .progress {
            font-size: 0.7rem;
            color: #8b949e;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .continue-watching-card .watched-date {
            font-size: 0.65rem;
            color: #a78bfa;
            font-weight: 500;
            margin-top: 0.1rem;
        }

        .continue-watching-card .close-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(0, 0, 0, 0.4);
            color: white;
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 0.8rem;
            line-height: 1;
            text-align: center;
            cursor: pointer;
            opacity: 1;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-button {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-weight: 600;
            transition: background-color 0.2s;
            cursor: pointer;
        }

        .nav-button.active {
            background-color: #d8b4fe;
            color: #000;
        }

        .nav-button.inactive {
            background-color: #21262d;
            color: #8b949e;
        }

        .new-release-card {
            display: flex;
            flex-direction: column;
            width: 120px;
            height: 160px;
            background: #161b22;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            flex-shrink: 0;
        }

        .new-release-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .new-release-card .image-container {
            width: 100%;
            height: 70%;
            overflow: hidden;
            border-radius: 8px 8px 0 0;
        }

        .new-release-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .new-release-card .card-info {
            padding: 0.5rem;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        @keyframes pulse-banner {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.08); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        .animate-pulse-banner {
            animation: pulse-banner 2s infinite ease-in-out;
        }

        #floatingHeart {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 90;
            cursor: pointer;
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 150px;
            animation: floatAnimation 8s infinite alternate ease-in-out;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.7);
        }

        @keyframes floatAnimation {
            0% { left: 5%; }
            100% { left: 80%; }
        }

        /* Restored Secret Heart Video Modal styling */
        #heartVideoModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 101;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        #heartVideoModal .modal-content-heart {
            background: #1f242c;
            border-radius: 16px;
            padding: 1rem;
            max-width: 95vw;
            width: 400px;
            max-height: 90vh;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        #heartVideoModal .close-btn-heart {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            font-size: 1.2rem;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            transition: background 0.2s;
        }

        @media (max-width: 767px) {
            .container { padding: 1rem; }
            .header { flex-direction: column; align-items: flex-start; gap: 1rem; }
            #searchInput { width: 100%; }
            .nav-button { flex: 1; padding: 0.5rem; font-size: 0.9rem; }
            .nav-button svg { display: none; }
            .new-release-card { width: 100px; height: 140px; }
            .gallery-container { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 1rem; }
            .gallery-card img { height: 150px; }
        }

        #iframeContainer:fullscreen { width: 100% !important; height: 100% !important; }

        .favorite-heart {
            position: absolute;
            top: 5px;
            right: 5px;
            z-index: 10;
            font-size: 1.5rem;
            cursor: pointer;
            text-shadow: 0 0 5px black;
        }

        .favorite-heart.active { color: #ff69b4; }
        .favorite-heart.inactive { color: #a0a0a0; }

        .watched-banner {
            position: absolute;
            top: 0;
            right: 0;
            background: #2e8b57;
            color: white;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 4px 8px;
            border-bottom-left-radius: 8px;
            z-index: 5;
            box-shadow: -2px 2px 5px rgba(0,0,0,0.3);
            pointer-events: none;
        }

        /* Modernized Equalizer Slide Out Styles */
        .eq-container {
            max-width: 0px;
            overflow: hidden;
            transition: max-width 0.5s cubic-bezier(0.4, 0, 0.2, 1), padding 0.5s;
            display: flex;
            align-items: center;
        }
        .eq-container.open {
            max-width: 200px;
            padding-left: 0.75rem;
        }

        /* ================= LIQUID GLASS MODAL STYLES ================= */
        .orb {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
            opacity: 0.5;
            animation: float 25s infinite alternate;
            pointer-events: none; /* Prevent mouse actions from creating wiggles */
        }
        .orb-1 { background: var(--p900); top: -200px; left: -100px; }
        .orb-2 { background: var(--p600); bottom: -200px; right: -100px; animation-delay: -7s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(100px, 50px) scale(1.3); }
        }

        .scrollbar-custom::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .scrollbar-custom::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
        }
        .scrollbar-custom::-webkit-scrollbar-thumb {
            background: rgba(147, 51, 234, 0.3);
            border-radius: 10px;
        }
        .scrollbar-custom::-webkit-scrollbar-thumb:hover {
            background: rgba(147, 51, 234, 0.6);
        }

        .channel-tile {
            background: rgba(15, 10, 30, 0.55);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(147, 51, 234, 0.15);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .channel-tile:hover {
            border-color: rgba(147, 51, 234, 0.45);
            background: rgba(25, 15, 50, 0.65);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(147, 51, 234, 0.15);
        }

        .channel-tile.selected {
            border-color: rgba(168, 85, 247, 0.8);
            background: rgba(45, 15, 80, 0.5);
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.3);
        }

        .player-container {
            box-shadow: 0 0 50px rgba(0,0,0,0.8), 0 0 20px rgba(147, 51, 234, 0.25);
        }

        #p-title {
            background: linear-gradient(to right, #ffffff, #e9d5ff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-black via-purple-500 to-purple-200 text-gray-100">

    <audio id="myAudio" src="hollaBB.m4a" preload="auto" crossorigin="anonymous"></audio>
    <audio id="radioAudio" crossorigin="anonymous" preload="none"></audio>

    <div class="container py-8">
        <header class="flex flex-col md:flex-row items-center justify-between gap-4 mb-8">
            <h1 class="text-4xl font-bold text-purple-300 font-pecita">heathers site</h1>
            
            <button id="liveTvTrigger" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
                <span class="text-2xl" role="img" aria-label="Union Jack Flag">🇬🇧</span>
                <span class="text-white"><b>Live TV</b></span>
            </button>

            <div class="flex flex-col md:flex-row items-center gap-4 w-full md:w-auto">
                <div class="relative w-full md:w-auto">
                    <input type="text" id="searchInput" placeholder="Search for movies or TV shows..."
                        class="w-full md:w-80 p-3 pl-10 bg-gray-800 rounded-full text-white focus:outline-none focus:ring-2 focus:ring-purple-300 transition-all duration-300" />
                    <svg class="absolute left-3 top-1/2 -translate-y-1/2 h-5 w-5 text-gray-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd"></path></svg>
                </div>
                <div class="flex gap-2 w-full md:w-auto">
                    <button id="showMoviesBtn" class="nav-button active">Movies</button>
                    <button id="showTvBtn" class="nav-button inactive">TV Shows</button>
                </div>
            </div>
        </header>

        <div class="flex flex-col md:flex-row items-center md:items-start justify-center md:justify-start gap-6 mb-8 bg-gray-900/60 p-4 rounded-2xl border border-purple-500/20 backdrop-blur-md max-w-2xl mx-auto md:mx-0">
            <div class="flex items-center bg-gray-800/80 p-3 rounded-xl shadow-lg border border-purple-400/30 transition-all duration-300">
                <button id="playButton" onclick="togglePlayback()" class="flex items-center justify-center w-12 h-12 text-purple-300 bg-purple-900/50 border border-purple-500/30 rounded-xl shadow-md hover:bg-purple-800 focus:outline-none transition-all duration-200 shrink-0">
                    <svg id="musicHeroicon" class="w-6 h-6 transition-colors duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path>
                    </svg>
                </button>
                <div id="audioEqContainer" class="eq-container">
                    <div class="visualizer-container h-10 w-32 p-0.5 bg-gray-950/80 rounded-lg border border-purple-500/20 shadow-inner">
                        <canvas id="audio-canvas" class="w-full h-full"></canvas>
                    </div>
                </div>
                <div class="ml-3 pr-2 min-w-[100px]">
                    <h3 class="text-xs font-bold text-white uppercase tracking-wider">Holla BB</h3>
                    <p id="message" class="text-[10px] text-purple-300 font-medium truncate">Press Button To Play</p>
                </div>
            </div>

            <div class="flex items-center bg-gray-800/80 p-3 rounded-xl shadow-lg border border-blue-400/30 transition-all duration-300">
                <button id="radioPlayButton" onclick="toggleRadioPlayback()" class="flex items-center justify-center w-12 h-12 text-blue-300 bg-blue-900/50 border border-blue-500/30 rounded-xl shadow-md hover:bg-blue-800 focus:outline-none transition-all duration-200 shrink-0">
                    <svg id="radioMusicHeroicon" class="w-6 h-6 transition-colors duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path>
                    </svg>
                </button>
                <div id="radioEqContainer" class="eq-container">
                    <div class="visualizer-container h-10 w-32 p-0.5 bg-gray-950/80 rounded-lg border border-blue-500/20 shadow-inner">
                        <canvas id="radio-canvas" class="w-full h-full"></canvas>
                    </div>
                </div>
                <div class="ml-3 pr-2 flex flex-col justify-center max-w-[120px]">
                    <select id="radioStationSelect" class="bg-gray-900 text-white text-[10px] p-1 rounded font-semibold border border-blue-500/20 focus:outline-none mb-0.5">
                        <option value="https://streams.80s80s.de/party/mp3-192/">80s</option>
                        <option value="https://80s-90s.stream.laut.fm/80s-90s">90's</option>
                        <option value="https://stream.starfm.de/80srock/mp3-192/">80's Rock</option>
                        <option value="https://laut-bon-jovi.stream.laut.fm/laut-bon-jovi">80's Rock</option>
                        <option value="https://streams.80s80s.de/romanticrock/mp3-128/">80's Rock</option>
                    </select>
                    <p id="radioMessage" class="text-[10px] text-blue-300 font-medium truncate pl-1">Press Button To Play</p>
                </div>
            </div>
        </div>

        <section id="continueWatchingSection" class="mt-8 mb-8" style="display: none;">
            <h2 class="text-2xl font-semibold">Continue Watching</h2>
            <div id="continueWatchingContainer" class="flex flex-wrap gap-4 mt-4"></div>
        </section>

        <main class="mt-8">
            <div class="flex items-center justify-between mb-6">
                <h2 id="galleryTitle" class="text-2xl font-semibold">Popular Movies</h2>
                <div class="flex items-center gap-2">
                    <button id="prevPage" class="p-2 bg-gray-700 rounded-full text-white hover:bg-gray-600 disabled:opacity-50"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" /></svg></button>
                    <span id="pageInfo" class="text-gray-100 text-sm"></span>
                    <button id="nextPage" class="p-2 bg-gray-700 rounded-full text-white hover:bg-gray-600 disabled:opacity-50"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" /></svg></button>
                </div>
            </div>
            <div id="galleryContainer" class="gallery-container"></div>
            <div class="flex items-center justify-end mt-6">
                <div class="flex items-center gap-2">
                    <button id="prevPageBottom" class="p-2 bg-gray-700 rounded-full text-white hover:bg-gray-600 disabled:opacity-50"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" /></svg></button>
                    <span id="pageInfoBottom" class="text-gray-100 text-sm"></span>
                    <button id="nextPageBottom" class="p-2 bg-gray-700 rounded-full text-white hover:bg-gray-600 disabled:opacity-50"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" /></svg></button>
                </div>
            </div>
        </main>
    </div>

    <div id="videoModal" class="hidden">
        <div class="modal-content">
            <button id="modalCloseBtn" class="close-btn">&times;</button>
            <h2 id="modalTitle" class="text-xl md:text-2xl font-bold mb-4"></h2>
            <div class="player-wrapper">
                <div class="player-main">
                    <div id="iframeContainer" class="relative w-full h-0 pb-[56.25%] rounded-lg overflow-hidden bg-black"></div>
                    <div class="p-4 bg-gray-800 rounded-lg mt-4">
                        <h3 id="nowPlaying" class="text-lg font-semibold text-white"></h3>
                        <p id="summary" class="text-sm text-gray-400 mt-2"></p>
                    </div>
                </div>
                <div class="player-sidebar">
                    <div class="flex flex-col gap-4">
                        <label class="text-sm text-gray-400 mb-1">Select Source</label>
                        <div class="flex gap-2">
                            <select id="sourceSelector" class="w-full px-3 py-2 bg-gray-700 rounded-lg text-white"></select>
                            <button id="trailerBtn" class="py-2 px-4 bg-red-600 rounded-lg text-white">Trailer</button>
                        </div>
                        <button id="fullscreenBtn" class="mt-2 py-2 px-4 bg-purple-600 rounded-lg text-white font-bold">FULLSCREEN</button>
                        <div class="flex gap-2">
                            <button id="showNoSandboxBtn" class="flex-1 py-2 px-4 rounded-lg font-semibold active ring-2 ring-purple-300">Sources with Ads</button>
                            <button id="showSandboxBtn" class="flex-1 py-2 px-4 rounded-lg font-semibold inactive">Sources w/o Ads</button>
                        </div>
                        <div id="episodeSelector" class="flex flex-col gap-4 hidden">
                            <select id="seasonSelect" class="w-full px-3 py-2 bg-gray-700 rounded-lg text-white"></select>
                            <select id="episodeSelect" class="w-full px-3 py-2 bg-gray-700 rounded-lg text-white"></select>
                        </div>
                        <div id="episodeNavButtons" class="flex gap-2 hidden">
                            <button id="prevEpisodeBtn" class="flex-1 py-2 px-4 bg-purple-300 rounded-lg text-black">Previous</button>
                            <button id="nextEpisodeBtn" class="flex-1 py-2 px-4 bg-purple-300 rounded-lg text-black">Next</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="liveTvModal" class="fixed inset-0 z-[110] hidden flex items-center justify-center bg-black/95 backdrop-blur-md overflow-hidden p-3 md:p-6">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        
        <div class="relative w-full max-w-7xl h-full max-h-[92vh] bg-slate-950/80 border border-purple-500/20 rounded-3xl flex flex-col p-4 md:p-6 overflow-hidden shadow-2xl">
            <div class="flex items-center justify-between mb-4 flex-shrink-0">
                <div class="flex items-center gap-3">
                    <div></div>
                </div>
                <button id="closeLiveTv" class="h-5 w-5 rounded-full bg-purple-900/20 text-purple-200 border border-purple-500/30 hover:bg-red-500 hover:text-white hover:border-red-400 transition-all flex items-center justify-center font-bold text-lg">✕</button>
            </div>

            <div class="w-full flex-1 flex flex-col lg:flex-row gap-5 overflow-hidden z-10 min-h-0">
                <div class="flex-shrink-0 lg:flex-1 h-auto lg:h-full flex flex-col gap-3 overflow-hidden min-h-0">
                    
                    <div class="player-container w-full aspect-video bg-black rounded-2xl border border-purple-500/25 overflow-hidden relative flex-shrink-0">
                        <iframe id="main-player" allowfullscreen referrerpolicy="no-referrer" allow="autoplay; encrypted-media" class="w-full h-full border-none"></iframe>
                        <div id="player-placeholder" class="absolute inset-0 flex flex-col items-center justify-center bg-purple-950/90 backdrop-blur-xl text-purple-200 font-bold text-xs uppercase tracking-widest gap-2">
                            Select a Channel
                        </div>
                    </div>

                    <div class="bg-slate-950/80 border border-purple-500/20 rounded-xl px-4 py-3 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 flex-shrink-0 text-xs">
                        <div class="flex flex-col">
                            <span id="current-source-label" class="text-[9px] text-purple-400/70 font-semibold mt-0.5">Primary stream active</span>
                        </div>
                        <div class="flex items-center gap-2 flex-wrap w-full sm:w-auto">
                            <button id="btn-primary" onclick="setStreamSource('primary')" class="flex-1 sm:flex-initial px-3.5 py-2 rounded-lg font-bold uppercase text-[10px] tracking-wider transition-all duration-200 bg-purple-600/80 text-white border border-purple-400/40 shadow-lg shadow-purple-500/20">
                                Primary
                            </button>
                            <button id="btn-backup" onclick="setStreamSource('backup')" class="flex-1 sm:flex-initial px-3.5 py-2 rounded-lg font-bold uppercase text-[10px] tracking-wider transition-all duration-200 bg-purple-950/40 text-purple-300 border border-purple-500/20 hover:border-purple-400/40 hover:bg-purple-900/25">
                                Backup 1
                            </button>
                            <button id="btn-backup2" onclick="setStreamSource('backup2')" class="flex-1 sm:flex-initial px-3.5 py-2 rounded-lg font-bold uppercase text-[10px] tracking-wider transition-all duration-200 bg-purple-950/40 text-purple-300 border border-purple-500/20 hover:border-purple-400/40 hover:bg-purple-900/25">
                                Backup 2
                            </button>
                        </div>
                    </div>

                    <div class="hidden lg:flex flex-1 bg-slate-950/40 backdrop-blur-xl border border-purple-500/25 rounded-2xl p-5 overflow-y-auto scrollbar-custom flex-col justify-start">
                        <h1 id="p-title" class="text-xl md:text-3xl font-extrabold tracking-tight truncate font-sans">Select a Channel</h1>
                        
                        <div id="p-meta" class="flex items-center gap-4 text-purple-200 font-semibold text-xs md:text-sm mt-2 opacity-0 transition-opacity duration-300">
                            <span id="p-time-range" class="bg-purple-900/40 px-2.5 py-0.5 rounded border border-purple-500/30"></span>
                            <span class="w-1.5 h-1.5 rounded-full bg-purple-400"></span>
                            <span id="p-channel-name" class="font-bold"></span>
                        </div>
                        
                        <p id="p-desc" class="text-purple-100/60 text-xs md:text-sm mt-3.5 leading-relaxed">
                            Click any channel
                        </p>
                    </div>
                </div>

                <div class="w-full lg:w-[400px] flex-1 lg:flex-none min-h-0 lg:h-full flex flex-col bg-slate-950/40 backdrop-blur-xl border border-purple-500/25 rounded-2xl p-4 overflow-hidden shadow-2xl">
                    <div class="flex items-center justify-between mb-4 flex-shrink-0">
                        <div class="flex items-center gap-2">
                            <span class="w-3 h-3 rounded-full bg-purple-500 animate-pulse"></span>
                            <h2 class="text-lg font-extrabold tracking-tight text-white uppercase">Live Channels</h2>
                        </div>
                        <span id="sync-status" class="text-[10px] text-purple-300 font-bold bg-purple-950/50 px-2 py-0.5 rounded border border-purple-500/20">Syncing EPG...</span>
                    </div>

                    <div id="channels-list" class="flex-1 overflow-y-auto pr-1 flex flex-col gap-3 scrollbar-custom font-sans">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="floatingHeart" role="button">
        <span style="color: #a78bfa;">💜</span>
    </div>

    <div id="heartVideoModal">
        <div class="modal-content-heart">
            <button id="heartModalCloseBtn" class="close-btn-heart">&times;</button>
            <div class="relative w-full h-0 pb-[177.77%] rounded-lg overflow-hidden bg-black">
                <iframe id="heatherSecretYouTube" class="absolute top-0 left-0 w-full h-full" src="https://www.youtube.com/embed/88MgWvnZD5M?enablejsapi=1&rel=0" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <button id="openFavoritesBtn" class="fixed bottom-6 right-6 h-12 w-12 rounded-full bg-purple-600 text-white shadow-lg z-50 flex items-center justify-center font-bold">❤</button>
    
    <div id="favoritesModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60 backdrop-blur-sm p-4">
        <div class="relative w-full max-w-6xl rounded-2xl border border-gray-700 bg-gray-900 flex flex-col max-h-[90vh]">
            <div class="flex items-center justify-between px-4 py-3 border-b border-gray-700 bg-gray-900 sticky top-0 rounded-t-2xl z-10">
                <h3 class="text-xl font-semibold">My Favorites</h3>
                <button id="closeFavoritesBtn" class="h-9 w-9 flex items-center justify-center rounded-lg border border-gray-600 text-gray-300 hover:text-white">&times;</button>
            </div>
            <div class="p-4 overflow-y-auto">
                <div id="favoritesGrid" class="gallery-container">
                    <p id="noFavoritesMessage" class="text-center text-gray-500 col-span-full hidden">No favorites yet.</p>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
